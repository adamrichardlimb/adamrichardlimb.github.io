name: build-article-index
run-name: Generate /articles/articles.json for Markdown files
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  build-article-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate article index
        run: |
          cd articles
          # list all markdown files, strip newlines, make valid JSON array
          ls *.md | jq -R -s -c 'split("\n")[:-1]' > articles.json

      - name: Commit and push updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/articles.json
          git diff --staged --quiet || git commit -m "Build: update article index [skip ci]"
          git push

